<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4C29D3">
<title>Оформление заказа · карточка Ai</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/static/assets/favicon.png"><link rel="shortcut icon" href="/static/assets/favicon.ico"><link rel="apple-touch-icon" href="/static/assets/logo.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="карточка Ai">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #F4F2FA; --c-violet-soft: #8A7FE9; --c-rose: #E06F93; --c-mint: #62BFA4; --c-amber: #F2B054;
    --glass-1: rgba(255,255,255,0.45); --glass-3: rgba(255,255,255,0.75); --glass-4: rgba(255,255,255,0.9);
    --glass-border: rgba(255,255,255,0.7);
    --text: #1F1A35; --text-muted: rgba(31,26,53,0.72); --text-dim: rgba(31,26,53,0.55);
    --accent: #4C29D3; --accent-bright: #6B4FE0; --accent-glass: rgba(76,41,211,0.12);
    --shadow-glass: 0 8px 32px rgba(60,50,110,0.12), 0 2px 8px rgba(60,50,110,0.06);
    --inner-light: inset 0 1px 0 rgba(255,255,255,0.85), 0 0 0 1px rgba(60,50,110,0.04);
    --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-base); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100dvh; overflow-x: hidden; }
  .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #EDE5FB 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #F8E5EE 0%, transparent 60%), var(--bg-base); }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
  .blob-1 { width: 520px; height: 520px; background: var(--c-violet-soft); top: -100px; left: -120px; opacity: 0.4; }
  .blob-2 { width: 480px; height: 480px; background: var(--c-rose); bottom: -80px; right: -80px; opacity: 0.35; }
  .wrap { position: relative; z-index: 2; }
  .topnav { position: sticky; top: 14px; z-index: 50; max-width: 1080px; margin: 14px auto 0; padding: 0 14px; }
  .topnav-inner { background: var(--glass-3); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 22px; padding: 11px 18px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-glass), var(--inner-light); }
  .nav-back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 180ms; }
  .nav-back:hover { background: var(--glass-1); color: var(--text); }
  .nav-logo { font-family: var(--font-display); font-size: 17px; font-weight: 500; color: var(--text); text-decoration: none; margin-left: auto; }
  .nav-logo em { font-style: italic; color: var(--accent); }
  .checkout-grid { max-width: 1080px; margin: 36px auto 60px; padding: 0 28px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 28px; align-items: flex-start; }
  @media (max-width: 880px) { .checkout-grid { grid-template-columns: 1fr; gap: 20px; } .order-summary { order: -1; } }
  .panel { background: var(--glass-3); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; box-shadow: var(--shadow-glass), var(--inner-light); }
  .panel-title { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -0.01em; margin-bottom: 6px; }
  .panel-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .form-input { width: 100%; padding: 13px 16px; background: var(--glass-1); color: var(--text); border: 1px solid var(--glass-border); border-radius: 12px; font-family: inherit; font-size: 14.5px; transition: all 180ms; }
  .form-input:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 4px var(--accent-glass); }
  .pay-info { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; background: rgba(98,191,164,0.1); border: 1px solid rgba(98,191,164,0.25); border-radius: 14px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
  .pay-info svg { color: var(--c-mint); flex-shrink: 0; margin-top: 1px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 20px; font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }
  .consent input { margin-top: 2px; width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; }
  .consent a { color: var(--accent); text-decoration: none; } .consent a:hover { text-decoration: underline; }
  .submit-btn { width: 100%; padding: 16px 22px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: white; font-weight: 700; font-size: 15.5px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 30px rgba(76,41,211,0.35); cursor: pointer; transition: all 200ms; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden; }
  .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(76,41,211,0.45); }
  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .trust-row { display: flex; justify-content: center; gap: 18px; margin-top: 18px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
  .trust-row span { display: inline-flex; align-items: center; gap: 6px; }
  .trust-row svg { color: var(--c-mint); }
  .order-summary { position: sticky; top: 90px; }
  .summary-tier { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid rgba(60,50,110,0.08); }
  .summary-tier-name { font-family: var(--font-display); font-weight: 500; font-size: 24px; color: var(--text); margin-bottom: 4px; }
  .summary-tier-tagline { font-size: 13px; color: var(--text-muted); }
  .summary-badge { flex-shrink: 0; background: linear-gradient(135deg, var(--c-amber), var(--c-rose)); color: white; font-weight: 700; font-size: 10px; padding: 5px 11px; border-radius: 100px; letter-spacing: 0.06em; text-transform: uppercase; box-shadow: 0 4px 14px rgba(224,111,147,0.35); }
  .summary-count { margin: 18px 0; padding: 16px 18px; background: var(--accent-glass); border: 1px solid rgba(76,41,211,0.16); border-radius: 14px; }
  .summary-count-num { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -0.01em; color: var(--accent); line-height: 1.1; }
  .summary-count-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .summary-total { margin-top: 8px; padding-top: 18px; border-top: 1px solid rgba(60,50,110,0.08); display: flex; justify-content: space-between; align-items: baseline; }
  .summary-total-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .summary-total-amount { font-family: var(--font-display); font-weight: 500; font-size: 36px; color: var(--text); letter-spacing: -0.02em; }
  .summary-note { font-size: 11.5px; color: var(--text-dim); margin-top: 12px; line-height: 1.45; }
  .skeleton { text-align: center; padding: 50px; color: var(--text-dim); }
  /* Checkout slider */
  .co-slider-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .co-slider-big { font-family: var(--font-display); font-weight: 500; font-size: 30px; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
  .co-slider-big small { font-size: 14px; color: var(--text-muted); font-family: var(--font-body); font-weight: 500; }
  .co-slider-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; max-width: 180px; }
  .co-slider-price { text-align: right; flex-shrink: 0; }
  .co-slider-amt { font-family: var(--font-display); font-weight: 500; font-size: 24px; color: var(--accent); letter-spacing: -0.01em; }
  .co-slider-per { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 2px; }
  .co-slider-save { display: inline-block; margin-top: 6px; background: rgba(98,191,164,0.16); color: #2f9c7e; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 100px; letter-spacing: 0.03em; }
  .co-range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 100px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-bright) 100%); outline: none; margin: 4px 0 2px; }
  .co-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(76,41,211,0.35); cursor: pointer; transition: transform 140ms; }
  .co-range::-webkit-slider-thumb:hover { transform: scale(1.12); }
  .co-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--accent);
    box-shadow: 0 4px 12px rgba(76,41,211,0.35); cursor: pointer; }
  .co-ticks { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-dim); font-family: var(--font-mono); margin-bottom: 14px; }
  .co-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .co-preset { flex: 1; min-width: 64px; padding: 9px 6px; border-radius: 11px; border: 1px solid var(--glass-border);
    background: var(--glass-1); font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 160ms; font-family: inherit; }
  .co-preset:hover { border-color: var(--accent); color: var(--text); }
  .co-preset.active { background: var(--accent-glass); border-color: var(--accent); color: var(--accent); }

  /* === MOBILE-FIXES (audit pass 1) — checkout === */
  body { padding-top: env(safe-area-inset-top); }
  @media (max-width: 900px) {
    .blob-2 { display: none; }
    .blob { filter: blur(60px); }
  }
  @media (max-width: 600px) {
    body { font-size: 16px; }                              /* 16px — нет zoom-on-focus */
    .form-input { font-size: 16px !important; }
    .panel { padding: 20px !important; }
    .submit-btn { padding: 18px !important; min-height: 52px; }
    .co-preset { padding: 12px 10px !important; min-height: 44px; font-size: 13px !important; }
    .order-summary { position: relative !important; top: 0 !important; }
    .co-range::-webkit-slider-thumb { width: 32px !important; height: 32px !important; }
    .nav-back { padding: 10px 16px !important; font-size: 14px !important; min-height: 40px; }
    .summary-badge { font-size: 11px !important; padding: 6px 12px !important; }
  }
  @media (max-width: 420px) {
    .co-slider-big { flex-direction: column !important; align-items: flex-start !important; gap: 6px; }
  }
</style>
</head>
<body>
<div class="bg-canvas"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
<div class="wrap">
  <nav class="topnav"><div class="topnav-inner">
    <a href="/" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Назад</a>
    <a href="/" class="nav-logo">карточка <em>Ai</em></a>
  </div></nav>
  <div id="checkoutRoot"><div class="skeleton">Загрузка…</div></div>
</div>

<script src="/static/account.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let PRICING = null, ME = null, ORDER = null;

  // Единственная модель — произвольное число карточек (?cards=N).
  // Старые ссылки ?tier=start|seller|shop|studio мягко мапим на число карточек,
  // чтобы внешние ссылки/реклама не ломались.
  const LEGACY_TIER_CARDS = { start: 3, seller: 10, shop: 40, studio: 300 };
  function resolveOrder() {
    let cards = parseInt(params.get('cards') || '0');
    if (!cards) {
      const tier = params.get('tier');
      if (tier && LEGACY_TIER_CARDS[tier]) cards = LEGACY_TIER_CARDS[tier];
    }
    const sl = PRICING.slider || {};
    if (!cards) cards = sl.default_cards || 40;          // дефолт, если параметра нет
    return { cards: cards };                              // цена — через quoteLocal()
  }

  function renderForm() {
    $('checkoutRoot').innerHTML = `
      <div class="checkout-grid">
        <div class="panel">
          <h1 class="panel-title">Оформление заказа</h1>
          <p class="panel-sub">Оплата на защищённой странице · Чек на email · Разовый платёж (54-ФЗ)</p>
          <div class="form-group">
            <label class="form-label" for="ch-email">Email для чека и доступа</label>
            <input type="email" id="ch-email" class="form-input" placeholder="you@example.com" autocomplete="email" value="${ME ? ME.email : ''}" required>
          </div>
          <div class="pay-info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <div>Данные карты вводятся на защищённой странице платёжного провайдера — продавец их не видит и не хранит.</div>
          </div>
          <label class="consent">
            <input type="checkbox" id="ch-consent">
            <span>Я принимаю <a href="/legal#offer" target="_blank">условия оферты</a> и согласен(на) с <a href="/legal#privacy" target="_blank">политикой конфиденциальности</a></span>
          </label>
          <button class="submit-btn" id="payBtn" onclick="goPay()">
            <span id="payBtnLabel">Перейти к оплате</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
          <div class="trust-row">
            <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> SSL-шифрование</span>
            <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Разовый платёж</span>
            <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Карточки не сгорают</span>
          </div>
        </div>
        <div class="panel order-summary">
          <h2 class="panel-title" style="font-size:18px;margin-bottom:6px;">Ваш заказ</h2>
          <p class="panel-sub" style="margin-bottom:18px;">Сколько карточек берём? Чем больше — тем дешевле каждая.</p>
          <div class="co-slider-top">
            <div>
              <div class="co-slider-big"><span id="sumCards">…</span> <small id="sumCardsWord">карточек</small></div>
              <div class="co-slider-hint">одна карточка = один товар с паком дизайнов</div>
            </div>
            <div class="co-slider-price">
              <div class="co-slider-amt"><span id="sumTotal">…</span> ₽</div>
              <div class="co-slider-per" id="sumPer"></div>
              <span class="co-slider-save" id="sumSave" style="display:none;"></span>
            </div>
          </div>
          <input type="range" id="coRange" class="co-range" min="3" max="300" step="1" value="40" oninput="onSlide(this.value)">
          <div class="co-ticks"><span>3</span><span>150</span><span>300</span></div>
          <div class="co-presets" id="coPresets"></div>
          <div class="summary-total" style="border-top:none;margin-top:18px;padding-top:0;">
            <span class="summary-total-label">К оплате</span>
            <div><span class="summary-total-amount" id="sumTotalBig">…</span> <span style="font-size:13px;color:var(--text-muted);">₽</span></div>
          </div>
          <div class="summary-note">Разовый платёж — никаких подписок и автосписаний. Карточки добавятся на баланс сразу после оплаты и остаются навсегда. Чек придёт на email.</div>
        </div>
      </div>`;
    // настроим диапазон ползунка из конфигурации
    const sl = PRICING.slider || {};
    const r = $('coRange');
    if (r) { r.min = sl.min_cards || 3; r.max = sl.max_cards || 300; r.step = sl.step || 1; r.value = ORDER.cards; }
    renderPresets();
    fillSummary();
  }

  function renderPresets() {
    const host = $('coPresets'); if (!host) return;
    const sl = PRICING.slider || {};
    host.innerHTML = [10, 40, 100, 300].filter(n => n >= (sl.min_cards||3) && n <= (sl.max_cards||300))
      .map(n => {
        const q = Account.quoteLocal(n);
        return `<button type="button" class="co-preset" data-n="${n}" onclick="onSlide(${n}, true)">
                  ${n} · ${Account.fmt(Math.round(q.amount_rub))} ₽</button>`;
      }).join('');
  }

  window.onSlide = function (val, fromPreset) {
    const cards = parseInt(val); if (isNaN(cards)) return;
    ORDER.cards = cards;
    if (fromPreset) { const r = $('coRange'); if (r) r.value = cards; }
    fillSummary();
  };

  function fillSummary() {
    const q = Account.quoteLocal(ORDER.cards);
    ORDER.cards = q.cards; ORDER.amount_rub = q.amount_rub;
    $('sumCards').textContent = q.cards;
    $('sumCardsWord').textContent = Account.declCards(q.cards);
    $('sumPer').textContent = `${q.per_card_rub.toFixed(0)} ₽ за карточку`;
    const amt = Account.fmt(Math.round(q.amount_rub));
    $('sumTotal').textContent = amt;
    $('sumTotalBig').textContent = amt;
    const save = $('sumSave');
    if (q.discount_pct > 0) { save.style.display = ''; save.textContent = `выгода −${q.discount_pct}%`; }
    else save.style.display = 'none';
    $('payBtnLabel').textContent = `Перейти к оплате · ${amt} ₽`;
    // подсветим активный пресет
    document.querySelectorAll('.co-preset').forEach(b =>
      b.classList.toggle('active', parseInt(b.dataset.n) === q.cards));
  }

  window.goPay = async function () {
    const email = ($('ch-email').value || '').trim();
    if (!email || !email.includes('@')) { $('ch-email').focus(); toast('Введите корректный email'); return; }
    if (!$('ch-consent').checked) { toast('Подтвердите согласие с офертой'); return; }
    const btn = $('payBtn'); btn.disabled = true; $('payBtnLabel').textContent = 'Создаём заказ…';
    try {
      const payload = { cards: ORDER.cards, email, consent_offer: true,
            idempotency_key: 'cards-' + ORDER.cards + '-' + ME.id + '-' + Date.now() };
      const out = await Account.createPurchase(payload);
      location.href = out.confirmation_url;
    } catch (e) {
      btn.disabled = false; $('payBtnLabel').textContent = 'Перейти к оплате';
      if (e.status === 401) { Account.openAuth({ mode: 'login', onSuccess: () => location.reload() }); }
      else toast(e.message || 'Не удалось создать заказ');
    }
  };

  window.toast = function (msg) {
    let el = $('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast';
      el.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(31,26,53,0.92);color:white;padding:12px 22px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,0.25);z-index:9999;opacity:0;transition:opacity 280ms;backdrop-filter:blur(12px);';
      document.body.appendChild(el); }
    el.textContent = msg; el.style.opacity = '1';
    clearTimeout(window._toastT); window._toastT = setTimeout(() => { el.style.opacity = '0'; }, 2400);
  };

  async function load() {
    PRICING = await Account.pricing();
    ME = await Account.me(true);
    ORDER = resolveOrder();
    if (!ME) {
      // need login first; show form but prompt auth on pay (email prefilled after login)
      Account.openAuth({ mode: 'register', onSuccess: async () => { ME = await Account.me(true); renderForm(); } });
    }
    renderForm();
  }
  load();
</script>
</body>
</html>
