# /etc/nginx/sites-available/kartochka  → симлинк в /etc/nginx/sites-enabled/
# Кириллический домен example.com в nginx указывается в punycode.
server {
    listen 80;
    listen [::]:80;
    server_name xn--your-domain.example www.xn--your-domain.example;

    # загрузка фото товара — поднимаем лимит тела запроса (дефолтный 1 МБ мал)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # генерация стримит прогресс через SSE — буферизацию ВЫКЛ, таймауты ДЛИННЫЕ,
        # иначе прогресс «зависает», а долгие генерации обрываются по таймауту
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
# HTTPS-блок (listen 443 ssl ...) допишет certbot автоматически — см. DEPLOY.md, шаг 7.
